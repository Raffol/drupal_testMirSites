rsvplist.admin_settings:
  path: /admin/config/content/rsvplist
  defaults:
    form: \Drupal\rsvplist\Form\RSVPSettingsForm
    _title: RSVP List Settings
  requirements:
    _permission: administer rsvplist

rsvplist.report:
  path: /admin/report/rsvplist
  defaults:
    form: \Drupal\rsvplist\Controller\ReportController::report
    _title: List of RSVP s
  requirements:
    _permission: access rsvplist report
